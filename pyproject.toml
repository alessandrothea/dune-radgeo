[project]
name = "duneradgeo"
version = "0.1.0"
description = "Inspect DUNE background sources: detector geometry (GDML) and radiological volumes (FHiCL)"
readme = "README.md"
authors = [
    { name = "Alessandro Thea", email = "alessandro.thea@cern.ch" }
]
requires-python = ">=3.9"

# Full install: bki-extract, bki-plot, bki-measure, bki-distrib, bki-bkg and the notebook.
# bki-extract alone needs numpy, plus PyROOT (the root group below, or a dunesw
# area's ROOT) for producers with distrib_x/y/z: pip install --no-deps . numpy
dependencies = [
    "numpy",       # bki-extract, bki-plot --list / -L
    "matplotlib",  # bki-plot rendering, plot_ir
    "plotly",      # notebook_plot.make_figure
    "jupyter",     # notebooks/nb_B.ipynb, scripts/run_notebook.py
    "nbconvert",
    "rich",        # bki-bkg tables
]

# PyROOT for the host venv, from the `root` pip wheel: it evaluates the
# distrib_x/y/z TF1 formulas (bki-extract of producers with distrib_*,
# bki-distrib, tests/test_tf1.py) and is the ROOT that --gdml-backend root
# imports, although the current wheels (0.1a12) lack TGeo/GDML, so that
# backend works only with a full ROOT such as a dunesw area's.
# A dependency group, not a package dependency: `uv sync` installs it by
# default (see default-groups), `uv sync --no-group root` skips it, and
# `pip install .` never installs it, so a dunesw area uses its own (UPS) ROOT,
# never shadowed by the wheel.  The marker limits the group to Python >= 3.14,
# the host venv's Python.
[dependency-groups]
root = ["root>=0.1a12; python_version >= '3.14'"]

[tool.uv]
default-groups = ["root"]

[project.scripts]
bki-extract = "duneradgeo.extract:main"
bki-plot    = "duneradgeo.plot:main"
bki-measure = "duneradgeo.measure:main"
bki-distrib = "duneradgeo.distrib:main"
bki-bkg     = "duneradgeo.bkg:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duneradgeo"]
