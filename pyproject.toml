[project]
name = "duneradgeo"
version = "0.1.0"
description = "Inspect DUNE background sources: detector geometry (GDML) and radiological volumes (FHiCL)"
readme = "README.md"
authors = [
    { name = "Alessandro Thea", email = "alessandro.thea@cern.ch" }
]
requires-python = ">=3.9"

# Full install: radgeo extract, radgeo plot, radgeo measure, radgeo profiles, radgeo backgrounds and the notebook.
# Every command line is click + rich.  radgeo extract needs only numpy, click and
# rich, plus PyROOT (the root group below, or a dunesw area's ROOT) for
# producers with distrib_x/y/z: pip install --no-deps . numpy click rich
dependencies = [
    "numpy",       # radgeo extract, radgeo plot --list / -L
    "click",       # the command lines (radgeo, scripts/)
    "rich",        # messages and tables of the commands
    "matplotlib",  # radgeo plot rendering, plot_ir
    "plotly",      # notebook_plot.make_figure
    "jupyter",     # notebooks/nb_B.ipynb, scripts/run_notebook.py
    "nbconvert",
]

# Optional: radgeo extract --gdml-backend pyg4ometry.  A package extra, so
# `pip install ".[pyg4ometry]"` or `uv sync --extra pyg4ometry`; never installed
# by default (it pulls in scipy, pandas, sympy and vtk, about 1 GB).
[project.optional-dependencies]
pyg4ometry = ["pyg4ometry"]

# PyROOT for the host venv, from the `root` pip wheel: it evaluates the
# distrib_x/y/z TF1 formulas (radgeo extract of producers with distrib_*,
# radgeo profiles, tests/test_tf1.py) and is the ROOT that --gdml-backend root
# imports, although the current wheels (0.1a12) lack TGeo/GDML, so that
# backend works only with a full ROOT such as a dunesw area's.
# A dependency group, not a package dependency: `uv sync` installs it by
# default (see default-groups), `uv sync --no-group root` skips it, and
# `pip install .` never installs it, so a dunesw area uses its own (UPS) ROOT,
# never shadowed by the wheel.  The marker limits the group to Python >= 3.14,
# the host venv's Python.
[dependency-groups]
root = ["root>=0.1a12; python_version >= '3.14'"]

[tool.uv]
default-groups = ["root"]

[project.scripts]
radgeo      = "duneradgeo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duneradgeo"]
