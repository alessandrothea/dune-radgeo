[project]
name = "duneradgeo"
version = "0.1.0"
description = "Inspect DUNE background sources: detector geometry (GDML) and radiological volumes (FHiCL)"
readme = "README.md"
authors = [
    { name = "Alessandro Thea", email = "alessandro.thea@cern.ch" }
]
requires-python = ">=3.9"

# Full install: bki-extract, bki-plot and the notebook.
# bki-extract alone needs only numpy: pip install --no-deps . numpy
dependencies = [
    "numpy",       # bki-extract, bki-plot --list / -L
    "matplotlib",  # bki-plot rendering, plot_ir
    "plotly",      # notebook_plot.make_figure
    "jupyter",     # notebooks/nb_B.ipynb, scripts/run_notebook.py
    "nbconvert",
]

# ROOT for bki-extract --gdml-backend root.  A dependency group, not a
# package dependency: `uv sync` installs it by default (see default-groups),
# `uv sync --no-group root` skips it, and `pip install .` never installs it,
# so in the dunesw container the UPS ROOT is used and never shadowed.
# The pip wheels exist for CPython 3.14 only, hence the marker.
[dependency-groups]
root = ["root>=0.1a12; python_version >= '3.14'"]

[tool.uv]
default-groups = ["root"]

[project.scripts]
bki-extract = "duneradgeo.extract:main"
bki-plot    = "duneradgeo.plot:main"
bki-measure = "duneradgeo.measure:main"
bki-distrib = "duneradgeo.distrib:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duneradgeo"]
